[project]
name = "fastfs-server"
version = "0.1.0"
description = "Fast-FoundationStereo ZMQ server (mock by default; live model installed manually)."
readme = "README.md"
# FFS upstream targets Python 3.12.
requires-python = ">=3.12,<3.13"

# Light defaults: enough to run `python server.py --mock`. Real model deps
# (torch, xformers, FFS requirements.txt) are installed via `setup.sh` because
# torch + cu124 wheels and the FFS repo (no setup.py) can't be expressed in
# pyproject.toml cleanly.
dependencies = [
    "robot-tools",
]

[tool.uv.sources]
robot-tools = { path = "../..", editable = true }

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[tool.uv]
package = false
# Use uv-managed Python (which ships with dev headers / Python.h). The system
# /usr/bin/python3.12 may not have python3.12-dev installed, breaking Triton's
# JIT C-extension compile.
python-preference = "only-managed"
