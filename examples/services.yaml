# Launch profile for the example scripts (fake mode by default).
#   robot-tools launch examples/services.yaml  # from the repository root
# Clients read connection info from endpoints.yaml in this folder, not from
# this file. Drop the --fake flags once install + download are done.

services:
  - name: graspgen
    port: 5557
    # gpu: 0                                 # CUDA_VISIBLE_DEVICES (omit for default GPU)
    # Real: ["--gripper", "franka_panda"]    (or robotiq_2f_85/140, single_suction_cup_30mm)
    extra_args: ["--fake"]

  - name: graspgenx
    port: 5559
    # Real: ["--default-gripper", "robotiq_2f_85"]
    extra_args: ["--fake", "--default-gripper", "robotiq_2f_85"]

  - name: fastfs
    port: 5556
    # Real: ["--model", "23-36-37"]          (or 20-30-48 / 20-26-39 / 15-44-51 — smaller=faster)
    extra_args: ["--fake"]

  - name: sam3
    port: 5558
    # Real: []   (no extra args needed; needs `hf auth login` + access granted)
    extra_args: ["--fake"]
