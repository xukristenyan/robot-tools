[project]
name = "robot-tools-graspgen-runtime"
version = "0.1.0"
description = "GraspGen service runtime (fake-capable; real model installed separately)."
readme = "README.md"
requires-python = ">=3.10,<3.11"

# Enough to run `python server.py --fake`. The locked CUDA/model environment
# lives in real/ and is synced only by install.sh.
dependencies = [
    "robot-tools[server]",
]

[tool.uv.sources]
robot-tools = { path = "../..", editable = true }

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[tool.uv]
package = false
