[project]
name = "robot-tools-pointsam-real-runtime"
version = "0.1.0"
description = "Pinned Point-SAM ViT-L inference, without training or web-demo dependencies."
requires-python = ">=3.12,<3.13"
dependencies = [
    "robot-tools[server]",
    "torch==2.10.0",
    "torchvision==0.25.0",
    "timm==0.9.16",
    "hydra-core==1.3.2",
    "safetensors>=0.4",
    "torkit3d==0.1.2",
]

[tool.uv.sources]
robot-tools = { path = "../../..", editable = true }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torkit3d = { path = "../upstream/third_party/torkit3d" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
required-version = ">=0.11.21"
package = false
python-preference = "only-managed"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.dependency-metadata]]
name = "torkit3d"
version = "0.1.2"
requires-dist = ["torch>=1.12.1", "numpy"]

[tool.uv.extra-build-dependencies]
torkit3d = [{ requirement = "torch", match-runtime = true }, "setuptools<78", "wheel", "ninja"]
