[project]
name = "robot-tools-curobo-real-runtime"
version = "0.1.0"
description = "Locked cuRoboV2-Fast v0.9.0 CUDA 12 environment."
requires-python = ">=3.12,<3.13"
dependencies = [
    "robot-tools[server]",
    "nvidia-curobo[cu12]",
    "torch==2.10.0",
    "warp-lang==1.13.0",
]

[tool.uv.sources]
robot-tools = { path = "../../..", editable = true }
nvidia-curobo = { path = "../upstream", editable = true }
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
required-version = ">=0.11.21"
package = false
python-preference = "only-managed"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
