# Connection profile: where each service is reachable FROM THIS MACHINE.
# Copy into your client project as `endpoints.yaml`.
#
# This file lives with the *client*; services.yaml lives on the machine that
# *runs* the servers. To move a service to another machine, edit its host
# here — nothing else changes.
#
# Prefer stable hostnames over raw IPs so you never chase DHCP changes:
#   - mDNS:      gpu5090.local     (macOS built-in; Linux needs avahi)
#   - Tailscale: gpu5090           (works across networks / from home)
# Prefer SSH tunnels or binding to a Tailscale address. `host: 0.0.0.0` is
# appropriate only on a trusted, firewalled LAN; servers have no TLS/auth and
# must never be exposed directly to the public internet.
#
#   robot-tools status endpoints.yaml      # verify service identity, wire/API, and actions

endpoints:
  graspgen:  { host: 127.0.0.1, port: 5557 }
  graspgenx: { host: 127.0.0.1, port: 5559 }
  fastfs:    { host: 127.0.0.1, port: 5556 }
  sam3:      { host: 127.0.0.1, port: 5558 }
